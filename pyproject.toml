[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dats-selection"
version = "0.2.0"
description = "Diverse and Task-Specific Data Selection for Instruction Tuning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.3,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
models = ["torch>=2.6", "transformers>=4.45,<5", "sentencepiece>=0.2", "safetensors>=0.4"]

[project.scripts]
dats = "dats.cli:main"

[tool.setuptools.packages.find]
include = ["dats*"]
